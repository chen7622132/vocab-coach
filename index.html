<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafaf9">
<meta name="color-scheme" content="light">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="词汇教练">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>词汇教练</title>
<style>
:root{
  color-scheme: light;
  --bg:#fafaf9; --panel:#ffffff; --line:#e7e5e4; --ink:#1c1917;
  --muted:#78716c; --accent:#c2410c; --ok:#15803d; --bad:#b91c1c; --soft:#f5f5f4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:76px;
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(250,250,249,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;height:52px}
.hd h1{font-size:16px;margin:0;letter-spacing:.5px}
.hd .meta{font-size:12px;color:var(--muted)}
main{padding:16px 0 24px}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
p{margin:0 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;transition:.15s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#a8a29e}
textarea{resize:vertical;min-height:110px;line-height:1.6}
label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.tag.core{background:#fff7ed;color:#9a3412;border-color:#fed7aa;margin:2px 6px 2px 0}
.sep{height:1px;background:var(--line);margin:14px 0}
.empty{text-align:center;color:var(--muted);padding:36px 12px;font-size:14px}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav.tabbar .inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabbar button{background:none;border:0;font:inherit;font-size:11px;color:var(--muted);padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabbar button .ico{font-size:17px;line-height:1}
nav.tabbar button.on{color:var(--accent);font-weight:600}
.article{font-size:16.5px;line-height:1.85;letter-spacing:.1px}
.article .w{background:linear-gradient(transparent 62%,#fde68a 62%);cursor:pointer;border-radius:2px;padding:0 1px}
.article .w:active{background:#fde68a}
.article .w2{cursor:pointer}
.article .w2:active{background:#f5f5f4}
.article .tr{color:var(--muted);font-size:13.5px;line-height:1.75;margin:-2px 0 14px;padding-left:10px;border-left:2px solid var(--line)}
.wlist{display:flex;flex-direction:column;gap:2px}
.wrow{display:flex;align-items:baseline;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer}
.wrow:hover{background:var(--soft)}
.wrow .en{font-weight:600;font-size:14.5px;min-width:96px}
.wrow .ipa{color:var(--muted);font-size:12px;font-family:ui-monospace,monospace}
.wrow .zh{font-size:13px;color:#44403c;flex:1;text-align:right}
.wstar{color:var(--accent);font-size:11px}
details.card summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::before{content:"▸ ";color:var(--muted)}
details.card[open] summary::before{content:"▾ "}
.warm{padding:8px 0;border-bottom:1px dashed var(--line)}
.warm:last-child{border:0}
.tips{background:#fafaf9;border-left:3px solid var(--accent);padding:9px 11px;border-radius:6px;margin:10px 0;font-size:13px;line-height:1.7}
.q{border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:10px;background:var(--panel)}
.q .stem{font-size:15px;margin-bottom:9px;line-height:1.7}
.q .no{color:var(--accent);font-weight:700;margin-right:5px}
.q .fb{margin-top:8px;font-size:13.5px;line-height:1.7;padding:8px 10px;border-radius:7px;display:none}
.q .fb.show{display:block}
.q .fb.ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.q .fb.no{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.score{font-size:15px;padding:12px;border-radius:9px;background:var(--soft);text-align:center;margin-bottom:12px}
.mask{position:fixed;inset:0;background:rgba(28,25,23,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;animation:up .18s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:17px;color:var(--ink)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.6}
.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.6;white-space:pre-wrap}
code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:12.5px;font-family:ui-monospace,monospace}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border:0}

/* ==== 数据页新分段：概览/词库/曲线 ==== */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);border-radius:9px;padding:3px;margin:0 0 12px}
.seg button{background:none;border:0;font:inherit;font-size:13px;color:var(--muted);padding:7px 0;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.librow{padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.librow:last-child{border-bottom:0}
.librow:active{background:var(--soft)}
.librow .l1{display:flex;align-items:baseline;gap:6px}
.librow .l1 b{font-size:15.5px}
.librow .pos{font-size:11px;color:var(--muted)}
.librow .l2{display:flex;align-items:center;gap:6px;margin-top:2px}
.librow .mean{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--muted)}
.librow .cnt{font-size:11px;color:var(--muted);flex:none}
.badge{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:4px;flex:none;line-height:1.6}
.badge.new{background:#f5f5f4;color:#78716c}
.badge.learning{background:#ffedd5;color:#c2410c}
.badge.solid{background:#dbeafe;color:#1d4ed8}
.badge.done{background:#dcfce7;color:#15803d}
.badge.weak{background:#fee2e2;color:#b91c1c}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.chartbox{margin-top:10px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.legend .lg{display:inline-flex;align-items:center;gap:4px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.statrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.snd{background:none;border:0;padding:0 5px;margin:0;font-size:14px;line-height:1;cursor:pointer;opacity:.7;vertical-align:middle;font-family:inherit}
.snd:active{transform:scale(.88);opacity:1}
.snd.off{opacity:.35;cursor:help}
.article .sent{cursor:pointer;border-radius:3px;transition:background .12s}
.article .sent:active{background:#fef3c7}
.article .sent.saying{background:#fef3c7;box-shadow:inset 0 -2px 0 #f59e0b}
.readbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.qgroup{font-size:12px;color:var(--muted);margin:0 0 8px}
input[type=range]{padding:0;border:0;background:none}
.opt{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:11px 12px;margin-bottom:8px;font:inherit;font-size:14.5px;line-height:1.55;cursor:pointer;color:var(--ink);min-height:46px;transition:.12s}
.opt .k{flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);margin-top:2px}
.opt:active{transform:scale(.995)}
.opt.sel{border-color:#a8a29e;background:var(--soft)}
.opt.sel .k{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt.ok{border-color:#86efac;background:#f0fdf4}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no{border-color:#fca5a5;background:#fef2f2}
.opt.no .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.stage{background:var(--soft);border:1px dashed var(--line);border-radius:9px;padding:13px;text-align:center}
.stage p{margin:0 0 9px;font-size:13px;color:var(--muted)}
.hintw{font-family:ui-monospace,monospace;letter-spacing:1.5px;color:var(--accent);font-size:13px}
</style>
</head>
<body>

<header><div class="wrap hd">
  <h1>词汇教练</h1>
  <div class="meta" id="hdMeta"></div>
</div></header>

<main class="wrap" id="app"></main>

<nav class="tabbar"><div class="inner" id="tabs">
  <button data-v="home"><span class="ico">◉</span>今日</button>
  <button data-v="new"><span class="ico">＋</span>新词</button>
  <button data-v="read"><span class="ico">▤</span>阅读</button>
  <button data-v="quiz"><span class="ico">✎</span>练</button>
  <button data-v="data"><span class="ico">◫</span>数据</button>
</div></nav>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>

<script>
/* ============ 存储 ============ */
const APP_VERSION = 'v20';
const BUILD = '2026-10-20';
const LS_KEY = 'vocab_coach_db_v1';
const REVIEW_PER_ROUND = 20;

const DEFAULTS = {
  settings:{
    apiKey:'', baseUrl:'https://api.deepseek.com', proxy:'',
    visionModel:'deepseek-v4-flash-vision-exp',
    textModel:'deepseek-v4-flash',
    newPerDay:20,
    reviewPerDay:60,
    maxWords:12,
    practiceMode:'all',
    voiceName:'',
    voiceRate:1,
    twoStage:true
  },
  batches:[], cards:{}, activeBatchId:null, reviewLog:[]
};
let DB = load();
let state = {
  view:'home', busy:false, quizAnswers:{}, quizResult:null,
  reviewQueue:[], reviewIdx:0, showTranslation:false, whichArticle:'main',
  preview:null, retried:{}, revType:null,
  revealed:{}, optLocked:{}
};

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return structuredClone(DEFAULTS);
    const d = JSON.parse(raw);
    d.settings = Object.assign(structuredClone(DEFAULTS.settings), d.settings||{});
    d.batches = d.batches||[]; d.cards = d.cards||{}; d.reviewLog = Array.isArray(d.reviewLog)?d.reviewLog:[];
    return d;
  }catch(e){ return structuredClone(DEFAULTS); }
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
  catch(e){
    alert('⚠️ 保存失败：本地存储已满。\n\n刚才这一步的数据没有存上。\n请立刻到「数据」页导出 JSON 备份，否则新记录会继续丢失。');
  }
}

/* ============ 工具 ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&#38;','<':'&#60;','>':'&#62;','"':'&#34;',"'":'&#39;'}[c]));
const STOP = new Set('the and but for with that this from have has had was were are you your his her its our their they them she him not can will would could should there here what when where which who how all any one two out off into over than then now just also very more most some such only own same too did does doing been being because while about after before again against between during through under above below both each few other so if or as at by in of on to up we he it is be do an my me us no go get got say said see make made take took come came know knew think thought look want give gave use used find found tell told ask asked work seem feel felt try tried leave left call called need needed'.split(' '));
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const addDays = (n) => { const d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const key = w => String(w||'').toLowerCase().trim();
function toast(msg){ const el=document.createElement('div'); el.textContent=msg;
  el.style.cssText='position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#1c1917;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:99;max-width:86%;';
  document.body.appendChild(el); setTimeout(()=>el.remove(),2200); }
function curBatch(){ return DB.batches.find(b=>b.id===DB.activeBatchId) || null; }
function dueCards(){ const t=todayStr(); return Object.values(DB.cards).filter(c=>c.due<=t); }

/* ============ AI 调用 ============ */
function endpoint(){
  const s = DB.settings;
  const base = (s.proxy && s.proxy.trim()) ? s.proxy.trim() : (s.baseUrl||'').trim();
  return base.replace(/\/+$/,'') + '/chat/completions';
}
async function callAI(content, model){
  const s = DB.settings;
  if(!s.apiKey) throw new Error('还没有填 API Key（去「数据」页填写）');
  const body = { model, messages:[{role:'user',content}], temperature:0.8, max_tokens:8000 };
  let res;
  try{
    res = await fetch(endpoint(), {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},
      body: JSON.stringify(Object.assign({}, body, {response_format:{type:'json_object'}}))
    });
    if(res.status===400){
      const t = await res.text();
      if(/response_format|json/i.test(t)){
        res = await fetch(endpoint(), {
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},
          body: JSON.stringify(body)
        });
      }else{
        throw new Error('接口返回 400：'+t.slice(0,300)+'\n\n可能是模型名不对，去「数据」页改成你账号可用的。');
      }
    }
  }catch(e){
    if(e instanceof TypeError){
      throw new Error('连不上接口，通常是：\n① 浏览器跨域(CORS)被拦\n② 网络/地址不对\n\n解法：运行 proxy.py，然后在「数据」页把代理地址填 http://localhost:8787');
    }
    throw e;
  }
  if(!res.ok){
    const t = await res.text();
    if(res.status===401) throw new Error('API Key 无效（401）。去 platform.deepseek.com 检查。');
    if(res.status===402) throw new Error('账户余额不足（402）。去 DeepSeek 平台充值。');
    if(res.status===429) throw new Error('请求太频繁（429），等一分钟再试。');
    throw new Error('接口错误 '+res.status+'：\n'+t.slice(0,400));
  }
  const data = await res.json();
  const txt = data && data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '';
  if(!txt) throw new Error('模型返回空内容，换个模型或稍后重试。');
  return txt;
}
function parseJSON(txt){
  let t = String(txt).trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if(a>=0 && b>a) t = t.slice(a,b+1);
  return JSON.parse(t);
}

/* ============ 生成 Prompt ============ */
function buildPrompt(o){
  const src = o.hasImage ? '这张图片' : '下面的内容';
  o = Object.assign({}, o);
  o.maxWords = clampNum(DB.settings.maxWords, 5, 25, 12);
  return `你是「语境化词汇学习教练」。请从${src}中提取英语生词（跳过 the/a/is 这类过于基础的词），只输出一个 JSON 对象，不要 markdown 代码块，不要任何解释。

JSON 结构（严格遵守字段名）：
{
 "words":[{"word":"","ipa":"","pos":"","meaning":"","derivatives":"","cefr":"A1|A2|B1|B2|C1","core":false,"tips":"怎么记","senses":["①...","②..."],"sentences":[{"en":"","zh":"","sense":"①..."},{"en":"","zh":"","sense":"②..."}]}],
 "article":{"title":"","genre":"叙事文","wordCount":0,"text":"正文，目标词用 **加粗** 包起来","translation":["第一段中文","第二段中文"]},
 "quiz":[{"type":"fill|spell|sense|collocation","word":"该题考的词","prompt":"","answer":"可接受答案用|分隔","explain":""}]
}

硬性要求：
1. 每个词必须给 2 个不同语境的例句；每句都必须配中文翻译和「本句词义」（如 "①极其重要的"）。
2. 一词多义时，两句尽量覆盖不同义项；senses 列出全部义项（含未在例句中出现的）。
3. ipa 用英式或美式音标均可；cefr 只填 A1/A2/B1/B2/C1；derivatives 填派生词或高频搭配，没有就空字符串。
4. article：用全部词写一篇 130–200 词的叙事短文（开头-冲突-结尾），读起来要像真人写的小故事，不要为了塞词而写生硬句子；目标词全部出现并用 **加粗**，wordCount 填实际词数。translation 必须逐段对应 text，段数完全相同。
5. quiz：8–12 题，题型只用 fill（例句挖空）/spell（给中文释义写英文）/sense（判断该词在此句的词义）/collocation（搭配辨析）。可以出选择题，但必须把选项写在 prompt 末尾并严格用「(A) 选项 (B) 选项 (C) 选项 (D) 选项」这一段格式，answer 填正确选项的原文（不要填字母）；填空/拼写类不要带选项。answer 多个可接受答案用 | 分隔；每题的 word 必须是 words 里出现过的词原形。
6. 全部用简体中文解释，英文只用在例句和单词本身。
7. words 最多 ${o.maxWords} 个：超过 ${o.maxWords} 个就只保留最值得学的 ${o.maxWords} 个（优先中高频、易混、考试常见）；不足 5 个时把原文里能找到的都列出来，不要编造。
8. 每个词必须有 tips：2–3 句中文讲「怎么记」——词根/词源、高频搭配、易混词对比、记忆钩子，任选最有用的写，不要空话。
9. 每个词必须有 core：true 表示本批最该先掌握的核心词（最多 8 个），其余 false。

学习者目标：${o.goal||'综合提升'}${o.onlyWords?'\n\n【本次只要词表】不要写文章、不要出题：article 返回 {"title":"","genre":"","wordCount":0,"text":"","translation":[]}，quiz 返回空数组 []。':''}${o.text?('\n\n原文内容：\n'+o.text):''}`;
}

/* ============ 图片压缩 ============ */
function compressImage(file, maxSide, quality){
  maxSide = maxSide || 1100; quality = quality || 0.86;
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const s = Math.min(1, maxSide/Math.max(img.width,img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      const ctx = c.getContext('2d');
      ctx.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
    img.src = url;
  });
}


/* ============ 发音（Web Speech API · 含鸿蒙坚盾降级） ============ */
const VOICE = { api:false, voice:null, blocked:false, started:false, warned:false, probing:false };

function detectVoice(){
  try{
    VOICE.api = !!(window.speechSynthesis && typeof window.SpeechSynthesisUtterance === 'function');
  }catch(e){ VOICE.api = false; }
  if(!VOICE.api) return;
  const pick = function(){
    let vs = [];
    try{ vs = window.speechSynthesis.getVoices() || []; }catch(e){ vs = []; }
    if(!vs.length) return;
    const en = [];
    for(let i=0;i<vs.length;i++){
      const l = String(vs[i].lang || '');
      if(/^en([-_]|$)/i.test(l)) en.push(vs[i]);
    }
    if(!en.length){ VOICE.voice = null; return; }
    VOICE.voice = en[0];
    for(let i=0;i<en.length;i++){
      if(/en[-_]US/i.test(String(en[i].lang||''))){ VOICE.voice = en[i]; break; }
    }
  };
  pick();
  try{
    if(window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener('voiceschanged', pick);
    else window.speechSynthesis.onvoiceschanged = pick;
  }catch(e){}
}
function canSpeak(){ return VOICE.api && !VOICE.blocked; }

/* 能力探测：不支持就完全不渲染按钮（不是点了没反应） */
function sndBtn(word){
  if(!canSpeak()) return '';
  const w = String(word||'').trim();
  if(!w) return '';
  return '<button class="snd" data-act="say" data-w="' + esc(w) + '" title="朗读" aria-label="朗读">🔊</button>';
}
function sayWord(word){
  const w = String(word||'').trim();
  if(!w) return;
  if(!canSpeak()){ speakFallback(w); return; }
  VOICE.started = false;
  try{
    const u = new SpeechSynthesisUtterance(w);
    if(VOICE.voice){ u.voice = VOICE.voice; u.lang = VOICE.voice.lang || 'en-US'; }
    else { u.lang = 'en-US'; }
    u.rate = 0.9; u.pitch = 1; u.volume = 1;
    u.onstart = function(){ VOICE.started = true; };
    u.onerror = function(ev){
      const code = ev && ev.error ? String(ev.error) : '';
      if(code === 'interrupted' || code === 'canceled') return;   /* 正常打断，不算禁用 */
      markVoiceBlocked('系统拒绝发声（' + (code || 'unknown') + '）');
    };
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
    /* 鸿蒙/部分 WebView：speak 不抛错、不触发 onstart，也永远不出声 —— 靠状态探测兜住 */
    setTimeout(function(){
      if(VOICE.started || VOICE.blocked) return;
      let busy = false;
      try{ busy = !!(window.speechSynthesis.speaking || window.speechSynthesis.pending); }catch(e){ busy = false; }
      if(!busy) markVoiceBlocked('设备没有响应语音合成');
    }, 900);
  }catch(e){ markVoiceBlocked('语音接口调不起来'); }
}
function markVoiceBlocked(why){
  VOICE.blocked = true;
  if(!VOICE.warned){
    VOICE.warned = true;
    toast('🔇 ' + why + '。可能开了坚盾守护/省电限制，已改用音标，其它功能不受影响');
  }
  try{ render(); }catch(e){}
}
/* 最终降级：不发声也要给到能用的东西 —— 音标 */
function speakFallback(w){

/* ============ 语速 / 音色 ============ */
function clampNum(v, lo, hi, dft){
  const n = Number(v);
  if(!isFinite(n)) return dft;
  return Math.min(hi, Math.max(lo, n));
}
function voiceRate(){
  return clampNum(DB.settings.voiceRate, 0.5, 1.5, 1);
}
function voiceRateLabel(){ return voiceRate().toFixed(1) + 'x'; }
function setRate(v){
  DB.settings.voiceRate = clampNum(v, 0.5, 1.5, 1);
  save();
  if(SPEAK.on){
    try{ window.speechSynthesis.cancel(); }catch(e){}
    SPEAK.on = false; SPEAK.list = []; SPEAK.i = 0;
    clearSpeakTimer(); clearSaying();
  }
  render();
  toast('语速 ' + voiceRateLabel() + (VOICE.api ? '' : '（这台设备不能朗读）'));
}
function cycleRate(){
  const seq = [0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3];
  const cur = voiceRate();
  let at = -1;
  for(let i=0;i<seq.length;i++){ if(Math.abs(seq[i]-cur) < 0.01){ at = i; break; } }
  setRate(seq[(at < 0 ? 3 : at + 1) % seq.length]);
}
function enVoices(){
  if(!VOICE.api) return [];
  let vs = [];
  try{ vs = window.speechSynthesis.getVoices() || []; }catch(e){ vs = []; }
  const out = [];
  for(let i=0;i<vs.length;i++){
    if(/^en([-_]|$)/i.test(String(vs[i].lang || ''))) out.push(vs[i]);
  }
  return out;
}
function pickVoiceByName(name){
  const list = enVoices();
  if(!list.length) return null;
  const want = String(name || '');
  let hit = null;
  for(let i=0;i<list.length;i++){ if(String(list[i].name || '') === want){ hit = list[i]; break; } }
  VOICE.voice = hit || VOICE.voice || list[0];
  return VOICE.voice;
}
function voiceOptionsHTML(){
  const list = enVoices();
  const cur = String(DB.settings.voiceName || '');
  let html = '<option value="">自动（设备默认英文音色）</option>';
  for(let i=0;i<list.length;i++){
    const n = String(list[i].name || '');
    html += '<option value="' + esc(n) + '"' + (n === cur ? ' selected' : '') + '>' +
      esc(n) + ' · ' + esc(String(list[i].lang || '')) + (list[i].localService ? '' : '（联网）') + '</option>';
  }
  return html;
}
function refreshVoices(){

  toast(n ? ('找到 ' + n + ' 个英文音色，选一个试试') : '没读到英文音色，去手机设置里装个英文语音包再点我');
}

/* ============ 句子切分（渲染与朗读共用，保证序号一致） ============ */
function splitSentences(txt){
  const s = String(txt || '').replace(/\s+/g, ' ').trim();
  if(!s) return [];
  const abbr = /^(mr|mrs|ms|dr|prof|st|jr|sr|vs|etc|e\.g|i\.e|no)$/i;
  const out = [];
  let buf = '';
  for(let i=0;i<s.length;i++){
    const ch = s.charAt(i);
    buf += ch;
    if(ch === '.' || ch === '!' || ch === '?'){
      const next = i + 1 < s.length ? s.charAt(i + 1) : '';
      const m = buf.match(/([A-Za-z.]+)\.$/);
      const isAbbr = !!(m && abbr.test(m[1]));
      if((next === '' || next === ' ' || next === '"' || next === "'") && !isAbbr){
        if(buf.trim()) out.push(buf.trim());
        buf = '';
      }
    }
  }
  if(buf.trim()) out.push(buf.trim());
  return out;
}
function artSentenceList(text){
  const paras = splitParas(text || '');
  const out = [];
  let idx = 0;
  for(let p=0;p<paras.length;p++){
    const ss = splitSentences(paras[p]);
    for(let k=0;k<ss.length;k++){
      out.push({ idx: idx++, para: p, text: ss[k].replace(/\*\*/g, '') });
    }
  }
  return out;
}

/* ============ 朗读队列 ============ */
const SPEAK = { list: [], i: 0, on: false, timer: null };

function clearSpeakTimer(){
  if(SPEAK.timer){ try{ clearTimeout(SPEAK.timer); }catch(e){} SPEAK.timer = null; }
}
function clearSaying(){
  const root = document.getElementById('art');
  if(!root) return;
  const all = root.querySelectorAll('.sent');
  for(let i=0;i<all.length;i++) all[i].classList.remove('saying');
}
function stopReading(silent){
  SPEAK.on = false; SPEAK.list = []; SPEAK.i = 0;
  clearSpeakTimer();
  try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
  clearSaying();
  if(!silent){ try{ render(); }catch(e){} }
}
function speakText(text, onend){
  const t = String(text || '').trim();
  if(!t){ if(onend) onend(); return; }
  if(!canSpeak()){ markVoiceBlocked('这台设备不能朗读'); if(onend) onend(); return; }
  let done = false;
  const fin = function(){ if(done) return; done = true; clearSpeakTimer(); if(onend) onend(); };
  try{
    const u = new SpeechSynthesisUtterance(t);
    if(VOICE.voice){ u.voice = VOICE.voice; u.lang = VOICE.voice.lang || 'en-US'; }
    else { u.lang = 'en-US'; }
    u.rate = voiceRate(); u.pitch = 1; u.volume = 1;
    u.onstart = function(){ VOICE.started = true; };
    u.onend = fin;
    u.onerror = function(ev){
      const code = ev && ev.error ? String(ev.error) : '';
      if(code === 'interrupted' || code === 'canceled'){ fin(); return; }
      markVoiceBlocked('系统拒绝朗读（' + (code || 'unknown') + '）');
      fin();
    };
    window.speechSynthesis.speak(u);
    const guess = Math.max(4000, Math.round(t.length * 130 / voiceRate()));
    clearSpeakTimer();
    SPEAK.timer = setTimeout(fin, guess);
  }catch(e){ markVoiceBlocked('朗读接口调不起来'); fin(); }
}
function highlightSi(idx){
  const root = document.getElementById('art');
  if(!root) return;
  const all = root.querySelectorAll('.sent');
  for(let i=0;i<all.length;i++) all[i].classList.remove('saying');
  const hit = root.querySelector('[data-si="' + idx + '"]');
  if(hit){
    hit.classList.add('saying');
    try{ hit.scrollIntoView({ block:'center', behavior:'smooth' }); }catch(e){}
  }
}
function readArticle(){
  const b = curBatch();

  const a = activeArticle(b) || {};

  if(!canSpeak()){ markVoiceBlocked('这台设备不能朗读'); return; }
  try{ window.speechSynthesis.cancel(); }catch(e){}
  SPEAK.list = list; SPEAK.i = 0; SPEAK.on = true;
  speakStep();
}
function speakStep(){
  if(!SPEAK.on) return;
  const item = SPEAK.list[SPEAK.i];
  if(!item){ stopReading(true); try{ render(); }catch(e){} toast('读完了'); return; }
  highlightSi(item.idx);
  speakText(item.text, function(){
    if(!SPEAK.on) return;
    SPEAK.i++;
    speakStep();
  });
}
function readFromSi(idx){
  const b = curBatch();

  const list = artSentenceList(a.text);
  if(!list.length) return;
  if(!canSpeak()){ markVoiceBlocked('这台设备不能朗读'); return; }
  let start = 0;
  for(let i=0;i<list.length;i++){ if(list[i].idx === Number(idx)){ start = i; break; } }
  try{ window.speechSynthesis.cancel(); }catch(e){}
  SPEAK.list = list; SPEAK.i = start; SPEAK.on = true;
  speakStep();
}
function togglePauseRead(){
  if(!SPEAK.on){ readArticle(); return; }
  try{

/* ============ 今日复习计数（去重：同一个词当天只算一次，错词回炉不重复计） ============ */
function todayReviewCount(){
  const t = todayStr();
  const log = Array.isArray(DB.reviewLog) ? DB.reviewLog : [];
  const seen = Object.create(null);
  let n = 0;
  for(let i=0;i<log.length;i++){
    const x = log[i];
    if(!x || x.d !== t) continue;
    const k = String(x.k || '');
    if(!k || seen[k]) continue;
    seen[k] = 1; n++;
  }
  return n;
}

/* ============ 间隔序列 ============ */
const STEPS = [1,3,7,14,30,60];
function schedule(card, grade){
  if(grade>=2) card.step = Math.min((card.step||0)+1, STEPS.length-1);
  else { card.step = Math.max(0, (card.step||0)-2); card.lapses = (card.lapses||0)+1; }
  card.due = addDays(STEPS[card.step]);
  card.reps = (card.reps||0)+1;
  card.last = todayStr();
  return card;
}
function toggleMark(i){
  const b = curBatch();
  if(!b || !b.words[i]){ toast('找不到这个词'); return; }
  const w = b.words[i];
  let c = DB.cards[key(w.word)];
  if(!c) c = upsertCard(w, b.id);
  c.unknown = !c.unknown;
  if(c.unknown && String(c.due||'') > todayStr()) c.due = todayStr();
  save(); render();
  toast(c.unknown ? '已标记不熟，今天会出现在待复习里' : '已取消标记');
}
function deleteWord(k){
  const c = DB.cards[k];
  if(!c){ toast('这个词不在词库里'); return; }
  const reps = c.reps||0;
  let msg = '从词库删除「' + (c.word||k) + '」？';
  msg += reps>0 ? ('\n\n它已经复习过 ' + reps + ' 次，删除后复习记录也一并消失。') : '\n\n它还没有任何复习记录。';
  msg += '\n\n文章正文不会改动，只从词库和所属批次的词表中移除。';
  if(!confirm(msg)) return;
  delete DB.cards[k];
  DB.batches.forEach(b=>{
    if(b && Array.isArray(b.words)) b.words = b.words.filter(w=> key(w.word) !== k);
  });
  if(Array.isArray(DB.reviewLog)) DB.reviewLog = DB.reviewLog.filter(x=> x && x.k !== k);
  if(Array.isArray(state.reviewQueue)) state.reviewQueue = state.reviewQueue.filter(x=> key(x.word) !== k);
  save();
  closeSheet();
  render();
  toast('已删除「' + (c.word||k) + '」');
}
function deleteBatch(id){
  const b = DB.batches.find(x=> x.id===id);
  if(!b) return;
  const ks = b.words.map(w=> key(w.word));
  const mine = ks.filter(k=> DB.cards[k] && DB.cards[k].batchId===id);
  const inReview = mine.filter(k=> (DB.cards[k].reps||0)>0);
  let msg = '删除第 '+ (DB.batches.findIndex(x=>x.id===id)+1) +' 批（'+(b.goal||'未设目标')+'，'+b.words.length+' 个词）？';
  if(mine.length){
    msg += '\n\n其中 '+mine.length+' 个词的复习记录会被一并删除';
    if(inReview.length) msg += '（含 '+inReview.length+' 个已开始复习的词）';
  }else{
    msg += '\n\n这些词还没有复习记录，删除无影响。';
  }
  if(!confirm(msg)) return;
  mine.forEach(k=>{ delete DB.cards[k]; });
  DB.batches = DB.batches.filter(x=> x.id!==id);
  if(DB.activeBatchId===id){
    DB.activeBatchId = DB.batches.length ? DB.batches[DB.batches.length-1].id : null;
  }
  save(); render();
  toast('已删除该批次');
}
function todayNewCount(){
  const t = todayStr();
  return Object.values(DB.cards).filter(c=> c.added===t).length;
}
function storageMB(){
  try{ return JSON.stringify(DB).length*2/1048576; }catch(e){ return 0; }
}
function upsertCard(w, batchId){
  const k = key(w.word);
  if(!DB.cards[k]){
    DB.cards[k] = { word:w.word, ipa:w.ipa||'', meaning:w.meaning||'', tips:w.tips||'', batchId,
      step:0, due:addDays(1), reps:0, lapses:0, last:null, unknown:false, added:todayStr() };
  }else{
    if(w.meaning) DB.cards[k].meaning = w.meaning;
    if(w.ipa) DB.cards[k].ipa = w.ipa;
    if(w.tips) DB.cards[k].tips = w.tips;
  }
  return DB.cards[k];
}

/* ============ 题干选项解析（兼容 AI 多种写法） ============ */
function parseOptions(prompt){
  const text = String(prompt||'');
  let opts = [];
  let m;
  /* 格式一：(A) xxx (B) xxx   也支持中文全角括号 */
  const reParen = /[(（]\s*([A-Da-d])\s*[)）]\s*([^()（）]*?)(?=[(（]\s*[A-Da-d]\s*[)）]|$)/g;
  while((m = reParen.exec(text)) !== null){
    const body = String(m[2]||'').trim().replace(/[；;，,]$/, '');
    if(body) opts.push({ key: m[1].toUpperCase(), text: body });
  }
  /* 格式二：A. xxx  B. xxx */
  if(opts.length < 2){
    opts = [];
    const reDot = /(?:^|[\s　])([A-D])\s*[.、)]\s*([^\s].*?)(?=(?:[\s　]+[A-D]\s*[.、)])|$)/g;
    while((m = reDot.exec(text)) !== null){
      const body = String(m[2]||'').trim().replace(/[；;，,]$/, '');
      if(body) opts.push({ key: m[1].toUpperCase(), text: body });
    }
  }
  if(opts.length < 2) return { stem: text, options: [] };
  /* 把选项从题干里剥掉，只留问题本身 */
  let cut = text.length;
  const ip = text.search(/[(（]\s*[A-Da-d]\s*[)）]/);
  const id = text.search(/(?:^|[\s　])A\s*[.、)]/);
  if(ip >= 0) cut = Math.min(cut, ip);
  if(id >= 0) cut = Math.min(cut, id);
  let stem = cut < text.length ? text.slice(0, cut) : text;
  stem = stem.replace(/[\s　]*[，,;；:：]$/, '').trim();
  if(!stem) stem = text;
  return { stem: stem, options: opts };
}
function spellHint(q){
  const raw = String((q && q.answer) || '').split('|')[0].trim();
  const w = raw.replace(/[^A-Za-z]/g, '');
  if(w.length < 2 || w.length > 24) return '';
  return w.charAt(0) + ' ' + '_ '.repeat(w.length - 1).trim() + '　' + w.length + ' 个字母';
}
function judgeChoice(q, opt){
  if(!opt) return false;
  if(judgeAnswer('fill', opt.text, q.answer)) return true;
  return judgeAnswer('fill', opt.key, q.answer);
}
function findOpt(pk, k){
  const key = String(k||'').toUpperCase();
  for(let i=0;i<pk.options.length;i++){ if(pk.options[i].key === key) return pk.options[i]; }
  return null;
}
function choiceBtnsHTML(qs, i, pk){
  const q = qs[i];
  const chosen = String(state.quizAnswers[i] || '');
  const locked = !!(state.optLocked && state.optLocked[i]);
  return pk.options.map(function(o){
    let cls = 'opt';
    if(locked){
      const right = judgeChoice(q, o);
      if(o.key === chosen) cls += right ? ' ok' : ' no';
      else if(right) cls += ' ok';
    } else if(o.key === chosen){ cls += ' sel'; }
    return '<button class="' + cls + '" data-act="chooseOpt" data-i="' + i + '" data-k="' + o.key + '"' +
      (locked ? ' disabled' : '') + '><span class="k">' + o.key + '</span><span>' + esc(o.text) + '</span></button>';
  }).join('');
}
function stageHTML(qs, i, pk){
  const keys = pk.options.map(function(o){ return o.key; }).join(' / ');
  return '<div class="stage"><p>这一题有选项。先在脑子里回想一下，再看选项。</p>' +
    '<button class="btn sm" data-act="revealOpts" data-i="' + i + '">看选项（' + keys + '）</button></div>';
}
function quizBodyHTML(qs, i){
  const q = qs[i];
  const pk = parseOptions(q.prompt);
  if(pk.options.length >= 2){
    const revealed = (DB.settings.twoStage === false) || !!(state.revealed && state.revealed[i]);
    return revealed ? choiceBtnsHTML(qs, i, pk) : stageHTML(qs, i, pk);
  }
  return '';
}
function scrollNextQ(i){
  const n = document.getElementById('qb' + (i+1));
  if(n && n.scrollIntoView){ try{ n.scrollIntoView({ block:'start', behavior:'smooth' }); }catch(e){} }
}

function quizGroupOf(t){ return String(t||'')==='spell' ? 'word' : 'sentence'; }
function quizSplit(qs){
  const sent = [], word = [];
  for(let i=0;i<qs.length;i++){ (quizGroupOf(qs[i].type)==='word' ? word : sent).push(i); }
  return { sent: sent, word: word };
}
function groupHeadHTML(title, sub, n, otherN){
  if(!n) return '';
  const solo = (otherN === 0);
  const head = solo ? ('共 ' + n + ' 题，都是' + title) : (title + '（' + n + ' 题）');
  return '<div class="card"><h2>' + head + '</h2><p class="small muted" style="margin:0">' + sub + '</p></div>';
}
function quizInputHTML(qs, i, saved){
  const q = qs[i];
  const pk = parseOptions(q.prompt);
  const head = '<div class="q" id="qb' + i + '"><div class="stem"><span class="no">' + (i+1) + '</span>' + esc(pk.stem) + '</div>';
  if(pk.options.length >= 2){
    return head + quizBodyHTML(qs, i) + '</div>';
  }
  const hint = spellHint(q);
  return head +
    (hint ? '<p class="small muted" style="margin:0 0 8px">提示：<span class="hintw">' + esc(hint) + '</span></p>' : '') +
    '<input data-ans="' + i + '" placeholder="在这里作答" value="' + esc(saved||'') + '" autocomplete="off" autocapitalize="off" spellcheck="false"></div>';
}
function quizItemHTML(qs, i, r, ua){
  const q = qs[i];
  const ok = r.detail[i];
  const pk = parseOptions(q.prompt);
  let ans;
  if(pk.options.length >= 2){
    const chosen = findOpt(pk, ua);
    ans = '<div class="small">你的答案：<b>' +
      (chosen ? (chosen.key + '. ' + esc(chosen.text)) : esc(ua || '（空）')) + '</b></div>' +
      '<div class="small muted" style="margin:4px 0 0">' +
      pk.options.map(function(o){ return (judgeChoice(q, o) ? '✓ ' : '· ') + o.key + '. ' + esc(o.text); }).join('<br>') +
      '</div>';
  }else{
    ans = '<div class="small">你的答案：<b>' + esc(ua || '（空）') + '</b></div>';
  }
  return '<div class="q"><div class="stem"><span class="no">' + (i+1) + '</span>' + esc(pk.stem) + '</div>' +
    ans +
    '<div class="fb show ' + (ok?'ok':'no') + '">' +
    (ok ? '✓ 正确' : '✗ 正确答案：' + esc(q.answer)) +
    (q.explain ? '<br><span class="small">' + esc(q.explain) + '</span>' : '') +
    '</div></div>';
}

/* ============ 事件 ============ */
let pendingImage = null;

function bind(){
  document.querySelectorAll('#tabs button').forEach(btn=>{
    btn.onclick = ()=>{ stopReading(true); state.view = btn.dataset.v; render(); window.scrollTo(0,0); };
  });
  document.querySelectorAll('[data-act]').forEach(el=>{
    el.onclick = (e)=>{
      const a = el.dataset.act;
      if((a === 'say' || a === 'lookup' || a === 'sayFrom') && e && e.stopPropagation){ e.stopPropagation(); }
      handleAct(el);
    };
  });
  const f = $('#file');
  if(f) f.onchange = async e=>{
    const file = e.target.files[0]; if(!file) return;
    try{
      pendingImage = await compressImage(file);
      $('#imgPrev').innerHTML = `<img src="${pendingImage}" style="max-width:100%;border-radius:8px;border:1px solid var(--line);margin-top:8px">`;
      const cb = $('#clearImgBtn'); if(cb) cb.disabled = false;
      toast('图片已就绪');
    }catch(err){ toast('图片处理失败'); }
  };
  document.querySelectorAll('[data-ans]').forEach(inp=>{
    inp.oninput = ()=>{ state.quizAnswers[inp.dataset.ans] = inp.value; };
    inp.onfocus = ()=>{
      try{
        setTimeout(function(){
          if(inp.scrollIntoView) inp.scrollIntoView({ block:'center', behavior:'smooth' });
        }, 280);
      }catch(e){}
    };
  });
  const imp = $('#importFile');
  if(imp) imp.onchange = e=>{
    const file = e.target.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const d = JSON.parse(r.result);
        if(!d.batches) throw new Error('格式不对');
        DB = d; DB.settings = Object.assign(structuredClone(DEFAULTS.settings), DB.settings||{});
        save(); render(); toast('导入成功');
      }catch(err){ toast('导入失败：不是有效的备份文件'); }
    };
    r.readAsText(file);
  };
  const q = $('#libQ');
  if(q){ q.oninput = e=>{ libState.q = e.target.value; libState.page = 1; refreshLib(); }; }
  const lf = $('#libFilter');
  if(lf){ lf.onchange = e=>{ libState.filter = e.target.value; libState.page = 1; refreshLib(); }; }
  const ls = $('#libSort');
  if(ls){ ls.onchange = e=>{ libState.sort = e.target.value; libState.page = 1; refreshLib(); }; }
}

function handleAct(el){
  const act = el.dataset.act;
  if(act==='dataTab'){ libState.tab = el.dataset.tab; libState.page = 1; state.view='data'; render(); return; }
  if(act==='libPage'){ libState.page = Math.max(1, parseInt(el.dataset.p,10)||1); refreshLib(); return; }
  if(act==='cardDetail'){ cardDetail(el.dataset.k); return; }
  if(act==='delBatch'){ deleteBatch(el.dataset.id); return; }
  if(act==='delWord'){ deleteWord(el.dataset.k); return; }
  if(act==='pvToggle'){ if(state.preview){ state.preview.sel[+el.dataset.i] = !!el.checked; render(); } return; }
  if(act==='pvAll'){ if(state.preview){ state.preview.sel = state.preview.sel.map(()=> el.dataset.v==='1'); render(); } return; }
  if(act==='pvConfirm'){ confirmPreview(); return; }
  if(act==='pvCancel'){ state.preview = null; state.view = 'new'; render(); toast('已放弃这次生成'); return; }
  if(act==='revHint'){
    const c = state.reviewQueue[state.reviewIdx];
    if(!c) return;
    const info = findWordData(c.word) || {};
    const w = String(c.word||'');
    const b = $('#revHintBox');
    if(b) b.textContent = '提示：' + w.charAt(0) + ' ' + '_ '.repeat(Math.max(0, w.length-1)).trim() + '（共 ' + w.length + ' 个字母' + (info.pos ? '，' + info.pos : '') + '）';
    return;
  }
  if(act==='revPick'){
    const c = state.reviewQueue[state.reviewIdx];
    if(!c) return;
    const ok = String(el.dataset.v||'').trim() === String(c.meaning||'').trim();
    showReviewAnswer(c, ok);
    return;
  }
  if(act==='go'){ state.view = el.dataset.v; render(); window.scrollTo(0,0); return; }
  if(act==='clearImg'){ pendingImage=null; $('#imgPrev').innerHTML=''; el.disabled=true; return; }
  if(act==='generate'){ doGenerate(); return; }
  if(act==='word'){ showWord(curBatch().words[+el.dataset.i]); return; }
  if(act==='revealOpts'){
    const i = parseInt(el.dataset.i, 10) || 0;
    if(!state.revealed) state.revealed = {};
    state.revealed[i] = true;
    const b = curBatch();
    const box = document.getElementById('qb' + i);
    if(b && box && b.quiz && b.quiz[i]){
      const pk = parseOptions(b.quiz[i].prompt);
      box.innerHTML = '<div class="stem"><span class="no">' + (i+1) + '</span>' + esc(pk.stem) + '</div>' + choiceBtnsHTML(b.quiz, i, pk);
      bind();
    }
    return;
  }
  if(act==='chooseOpt'){
    const i = parseInt(el.dataset.i, 10) || 0;
    const k = String(el.dataset.k || '').toUpperCase();
    if(state.optLocked && state.optLocked[i]) return;
    const b = curBatch();
    if(!b || !b.quiz || !b.quiz[i]) return;
    const q = b.quiz[i];
    const pk = parseOptions(q.prompt);
    const opt = findOpt(pk, k);
    if(!opt) return;
    state.quizAnswers[i] = k;
    if(!state.optLocked) state.optLocked = {};
    state.optLocked[i] = true;
    const box = document.getElementById('qb' + i);
    if(box){
      box.innerHTML = '<div class="stem"><span class="no">' + (i+1) + '</span>' + esc(pk.stem) + '</div>' + choiceBtnsHTML(b.quiz, i, pk);
      bind();
    }
    if(judgeChoice(q, opt)) setTimeout(function(){ scrollNextQ(i); }, 650);
    return;
  }
  if(act==='say'){ sayWord(el.dataset.w); return; }
  if(act==='sayFrom'){ readFromSi(el.dataset.si); return; }
  if(act==='readArticle'){ readArticle(); return; }
  if(act==='readPause'){ togglePauseRead(); return; }
  if(act==='readStop'){ stopReading(false); toast('已停止'); return; }
  if(act==='cycleRate'){ cycleRate(); return; }
  if(act==='refreshVoices'){ refreshVoices(); return; }
  if(act==='setMode'){
    const m = el.dataset.v||'all';
    DB.settings.practiceMode = (m==='sentence'||m==='word') ? m : 'all';
    save(); render();
    toast('练习模式：' + (m==='sentence'?'只练句子':(m==='word'?'只练单词':'句子+单词')));
    return;
  }
  if(act==='revPickSent'){
    const c = state.reviewQueue[state.reviewIdx];
    if(!c) return;
    const so = sentTranslateOptions(c);
    const ok = !!so && String(el.dataset.v||'').trim() === so.zh;
    showReviewAnswer(c, ok);
    return;
  }
  if(act==='voiceSelftest'){ voiceSelftest(); return; }
  if(act==='lookup'){ lookupWord(el.dataset.w); return; }
  if(act==='addWord'){ addWordFromArticle(el.dataset.w); return; }
  if(act==='explainWord'){ explainWord(el.dataset.w); return; }
  if(act==='toggleTr'){ toggleTranslation(); return; }
  if(act==='switchArt'){ state.whichArticle = el.dataset.v; state.showTranslation = false; render(); return; }
  if(act==='genDialogue'){ genDialogue(); return; }
  if(act==='writeSubmit'){ submitWriting(+el.dataset.stage); return; }
  if(act==='mark'){ toggleMark(+el.dataset.i); return; }
  if(act==='submitQuiz'){ submitQuiz(); return; }
  if(act==='resetQuiz'){ state.quizResult=null; state.quizAnswers={}; state.revealed={}; state.optLocked={}; render(); window.scrollTo(0,0); return; }
  if(act==='startReview'){ startReview(); return; }
  if(act==='revCheck'){ doRevCheck(); return; }
  if(act==='saveSettings'){ saveSettings(); return; }
  if(act==='export'){ exportDB(); return; }
  if(act==='exportAnki'){ exportAnki(); return; }
  if(act==='wipe'){ if(confirm('确定清空所有词和记录？不可恢复。')){ DB=structuredClone(DEFAULTS); save(); render(); } return; }
  if(act==='switchBatch'){ DB.activeBatchId = el.dataset.id; state.whichArticle='main'; state.showTranslation=false; state.quizAnswers={}; state.quizResult=null; state.revealed={}; state.optLocked={}; save(); render(); return; }
  if(act==='sheetClose'){ closeSheet(); return; }
  if(act==='grade'){ gradeReview(+el.dataset.g); return; }
}

/* ============ 生成 ============ */
async function doGenerate(){
  if(state.busy) return;
  const goalEl = $('#goal');
  const goal = goalEl ? goalEl.value : '综合提升';
  const pasteEl = $('#pasteText');
  const text = pasteEl ? pasteEl.value.trim() : '';
  if(!pendingImage && !text){ toast('先拍张照片，或粘贴一段词表'); return; }

  state.busy = true; render();
  try{
    const hasImg = !!pendingImage;
    const onlyWordsEl = $('#onlyWords');
    const onlyWords = !!(onlyWordsEl && onlyWordsEl.checked);
    const content = hasImg
      ? [{type:'text', text: buildPrompt({goal, text, hasImage:true, onlyWords:onlyWords})},
         {type:'image_url', image_url:{url: pendingImage}}]
      : buildPrompt({goal, text, hasImage:false, onlyWords:onlyWords});
    const model = hasImg ? DB.settings.visionModel : DB.settings.textModel;

    const raw = await callAI(content, model);
    let data;
    try{ data = parseJSON(raw); }
    catch(e){
      const fix = await callAI(
        '把下面的内容整理成严格 JSON（字段：words[]含 word/ipa/pos/meaning/derivatives/cefr/core/tips/senses/sentences[en,zh,sense]，article{title,genre,wordCount,text,translation}，quiz[type,word,prompt,answer,explain]）。只输出 JSON：\n\n'+raw,
        DB.settings.textModel
      );
      data = parseJSON(fix);
    }
    if(!data.words || !data.words.length) throw new Error('没提取到单词。照片可能太糊或词太多，试着只拍一小块。');

    const words = data.words.slice(0,25).map(normalizeWord);
    const article = onlyWords
      ? {title:'', genre:'', wordCount:0, text:'', translation:[]}
      : (data.article || {title:'未命名', genre:'叙事文', wordCount:0, text:'', translation:[]});
    const quiz = onlyWords ? [] : (data.quiz||[]).map(normalizeQuiz).filter(q=>q.prompt);

    state.preview = { goal: goal, words: words, article: article, quiz: quiz, sel: words.map(()=>true) };
    state.busy = false;
    state.view = 'preview';
    render(); window.scrollTo(0,0);
    toast('识别到 '+words.length+' 个词，确认后才会入库');
  }catch(e){
    state.busy = false; render();
    showError(e.message||String(e));
  }
}
function normalizeWord(w){
  return {
    word: String(w.word||'').trim(),
    ipa: String(w.ipa||'').trim(),
    pos: String(w.pos||'').trim(),
    meaning: String(w.meaning||'').trim(),
    derivatives: String(w.derivatives||'').trim(),
    cefr: String(w.cefr||'').trim(),
    core: !!w.core,
    tips: String(w.tips||'').trim(),
    senses: Array.isArray(w.senses)?w.senses.map(String):[],
    sentences: Array.isArray(w.sentences)?w.sentences.map(s=>({
      en:String(s.en||''), zh:String(s.zh||''), sense:String(s.sense||'')
    })):[]
  };
}
function normalizeQuiz(q){
  return {
    type:String(q.type||'fill'), word:String(q.word||'').trim(),
    prompt:String(q.prompt||''), answer:String(q.answer||''), explain:String(q.explain||'')
  };
}

/* ============ 词卡 ============ */
function showWord(w){
  if(!w) return;
  const tipsBlock = w.tips
    ? `<div class="tips"><div class="small" style="font-weight:600;margin-bottom:4px">怎么记</div><div class="small">${esc(w.tips)}</div></div>`
    : `<button class="btn sm" data-act="explainWord" data-w="${esc(w.word)}" style="margin:8px 0">补一份精讲（词根/搭配/易混/记忆钩子）</button>`;
  openSheet(`
    <h3>${esc(w.word)}${sndBtn(w.word)} <span class="muted" style="font-weight:400;font-size:13px">${esc(w.ipa||'')}</span></h3>
    <p class="small muted" style="margin:2px 0 10px">${esc(w.pos||'')} ${w.cefr?'· '+esc(w.cefr):''} ${w.core?'· <span class="wstar">⭐核心</span>':''}</p>
    <p><b>${esc(w.meaning)}</b></p>
    ${(w.senses&&w.senses.length)?'<p class="small muted">义项：'+esc(w.senses.join('　'))+'</p>':''}
    ${w.derivatives?`<p class="small">派生/搭配：${esc(w.derivatives)}</p>`:''}
    ${tipsBlock}
    <div class="sep"></div>
    ${(w.sentences||[]).map(s=>`
      <div style="margin-bottom:9px">
        <div style="font-size:14.5px">${esc(s.en)}</div>
        <div class="small muted">${esc(s.zh)}</div>
        <div class="small" style="color:var(--accent)">→ 本句词义：${esc(s.sense)}</div>
      </div>`).join('')}
    <button class="btn block" data-act="sheetClose" style="margin-top:8px">关闭</button>
  `);
}
async function explainWord(w){
  const b = curBatch();
  const hit = b ? b.words.find(x=>key(x.word)===key(w)) : null;
  openSheet(`<p class="small muted" style="margin:0">正在为「${esc(w)}」生成精讲…</p>`);
  try{
    const raw = await callAI(
      `你是英语词汇讲解老师。为单词「${w}」写一段"怎么记"的精讲：中文，80–150 字，必须包含——构词/词根或词源、一个高频搭配、一个易混词对比、一个记忆钩子（联想或画面）。写成 2–3 句自然的话，不要罗列。只输出 JSON：{"tips":"..."}`,
      DB.settings.textModel
    );
    const d = parseJSON(raw);
    const tips = String(d.tips||'').trim();
    if(!tips) throw new Error('生成失败，请重试');
    if(hit) hit.tips = tips;
    const c = DB.cards[key(w)]; if(c) c.tips = tips;
    save();
    showWord(hit || {word:w, ipa:'', meaning:'', sentences:[], tips:tips});
  }catch(e){ showError(e.message||String(e)); }
}
function lookupWord(raw){
  const w = String(raw).replace(/[*.,;:!?"'’()]/g,'').trim();
  if(!w) return;
  const b = curBatch();
  if(b){
    const hit = b.words.find(x=>key(x.word)===key(w)) || b.words.find(x=>key(x.word).startsWith(key(w))&&w.length>3);
    if(hit) return showWord(hit);
  }
  const c = DB.cards[key(w)];
  if(c) return showWord({word:c.word, ipa:c.ipa, meaning:c.meaning, tips:c.tips||'', sentences:[]});
  showAddWord(w);
}
function showAddWord(w){
  openSheet(`
    <h3>${esc(w)}</h3>
    <p class="small muted">这个词不在本批词表里。要加入单词本吗？</p>
    <button class="btn accent block" data-act="addWord" data-w="${esc(w)}">＋ 加入单词本（自动生成音标、释义、2 个例句、精讲）</button>
    <button class="btn block" data-act="sheetClose" style="margin-top:8px">不用了</button>
  `);
}
async function addWordFromArticle(w){
  const b = curBatch();
  openSheet(`<p class="small muted" style="margin:0">正在为「${esc(w)}」生成释义和例句…</p>`);
  try{
    const raw = await callAI(
      `你是英语词典。为单词「${w}」生成严格 JSON（不要 markdown）：
{"word":"原形","ipa":"","pos":"","meaning":"核心中文释义","derivatives":"派生词或高频搭配","cefr":"A1|A2|B1|B2|C1","core":false,"tips":"怎么记：构词/搭配/易混/记忆钩子","senses":["①...","②..."],"sentences":[{"en":"","zh":"","sense":"①..."},{"en":"","zh":"","sense":"②..."}]}
要求：两个例句覆盖不同语境；每句配中文翻译和本句词义；若「${w}」是变形，word 填原形。`,
      DB.settings.textModel
    );
    const d = parseJSON(raw);
    const src = d.word ? d : (Array.isArray(d.words) && d.words[0] ? d.words[0] : null);
    if(!src) throw new Error('生成结果格式不对，请重试');
    const nw = normalizeWord(src);
    nw.fromArticle = true;
    if(b && !b.words.some(x=>key(x.word)===key(nw.word))) b.words.push(nw);
    const c = upsertCard(nw, b?b.id:null);
    c.source = 'article';
    save(); render();
    showWord(nw);
    toast('已加入单词本');
  }catch(e){ showError(e.message||String(e)); }
}

/* ============ 翻译 / 对话版 ============ */
function toggleTranslation(){
  const b = curBatch(); if(!b) return;
  const a = activeArticle(b) || {};
  const has = Array.isArray(a.translation) && a.translation.length;
  if(!has){ translateArticle(); return; }
  state.showTranslation = !state.showTranslation;
  render();
}
async function translateArticle(){
  const b = curBatch(); if(!b) return;
  const isDia = state.whichArticle==='dialogue' && b.article2;
  const art = isDia ? b.article2 : b.article;
  const paras = splitParas(art && art.text || '');
  if(!paras.length){ toast('没有文章可翻译'); return; }

/* ============ 判分 ============ */
function norm(s){ return String(s||'').toLowerCase().replace(/[.,;:!?"'’]/g,'').replace(/\s+/g,' ').trim(); }
function lev(a,b){
  a = norm(a); b = norm(b);
  const m = a.length, n = b.length;
  if(!m) return n;
  if(!n) return m;
  let prev = Array.from({length:n+1}, (_, j)=>j);
  let cur = new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0] = i;
    for(let j=1;j<=n;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    }
    const t = prev; prev = cur; cur = t;
  }
  return prev[n];
}
function normCN(s){
  return String(s==null?'':s)
    .replace(/（[^）]*）|\([^)]*\)/g,'')
    .replace(/【[^】]*】|\[[^\]]*\]/g,'')
    .replace(/[①②③④⑤⑥⑦⑧⑨⑩]/g,'')
    .replace(/[，。、；：！？（）【】《》…—·\-\s]/g,'')
    .toLowerCase();
}
function judgeCN(u, cand){
  if(u === cand) return true;
  if(u.length < 2) return false;
  if(cand.indexOf(u) >= 0 && u.length >= Math.ceil(cand.length * 0.5)) return true;
  if(u.indexOf(cand) >= 0 && cand.length >= Math.ceil(u.length * 0.5)) return true;
  return false;
}
function judgeAnswer(type, ua, answer){
  const raw = String(ua==null?'':ua);
  if(!raw.trim()) return false;
  const list = String(answer||'').split('|');
  if(type==='spell'){
    const u = norm(raw);
    if(!u) return false;
    return list.map(norm).filter(Boolean).some(a => Math.abs(a.length-u.length)<=1 && lev(a,u)<=1);
  }
  const u2 = normCN(raw);
  if(!u2) return false;
  return list.map(normCN).filter(Boolean).some(a => a===u2 || judgeCN(u2, a));
}
function findWordForQuiz(b, q){
  if(q.word){
    const hit = b.words.find(x=>key(x.word)===key(q.word));
    if(hit) return hit;
  }
  const p = String(q.prompt||'').toLowerCase();
  for(const w of b.words){
    const k = key(w.word);
    if(k && k.length>2 && new RegExp('(^|[^a-z])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z]|$)','i').test(p)) return w;
  }
  for(const w of b.words){
    const m = String(w.meaning||'').slice(0,4);
    if(m && m.length>=2 && p.includes(m.toLowerCase())) return w;
  }
  return null;
}
function syncCardsByQuiz(b, detail, hitWord){
  const rate = detail.length ? detail.filter(Boolean).length/detail.length : 0;
  const fallback = rate>=0.8?3:(rate>=0.5?2:1);
  const graded = new Set();
  detail.forEach((ok,i)=>{
    const w = hitWord[i];
    if(!w) return;
    const k = key(w.word);
    if(graded.has(k)) return;
    graded.add(k);
    const c = DB.cards[k];
    if(c) schedule(c, ok?3:0);
  });
  b.words.forEach(w=>{
    const k = key(w.word);
    if(graded.has(k)) return;
    const c = DB.cards[k];
    if(c) schedule(c, fallback);
  });
}
function submitQuiz(){
  const b = curBatch(); if(!b) return;
  const qs = b.quiz||[];
  const detail = []; const hitWord = []; const wrong = [];
  let correct = 0;
  qs.forEach((q,i)=>{
    const pk = parseOptions(q.prompt);
    const ua = state.quizAnswers[i];
    let ok;
    if(pk.options.length >= 2){
      ok = judgeChoice(q, findOpt(pk, ua));
    }else{
      ok = judgeAnswer(q.type, ua, q.answer);
    }
    detail.push(ok); if(ok) correct++;
    const w = findWordForQuiz(b,q);
    hitWord.push(w);
    if(!ok) wrong.push(w ? w.word : (q.word||'题 '+(i+1)));
  });
  syncCardsByQuiz(b, detail, hitWord);
  state.quizResult = {correct:correct, total:qs.length, detail:detail, wrong:wrong};
  save(); render(); window.scrollTo(0,0);
}

const ALL_TYPES = ['word-zh','word-en','word-ipa','sent-en','sent-zh'];
function modeTypes(mode){
  if(mode==='sentence') return ['sent-zh','sent-en'];
  if(mode==='word') return ['word-zh','word-en','word-ipa'];
  return ALL_TYPES.slice();
}
function typeLabel(t){
  if(t==='word-zh') return '单词 · 英译中';
  if(t==='word-en') return '单词 · 中译英';
  if(t==='word-ipa') return '单词 · 音标拼写';
  if(t==='sent-en') return '句子 · 中译英';
  if(t==='sent-zh') return '句子 · 英译中';
  if(t==='recall') return '单词 · 英译中';
  if(t==='spell') return '单词 · 中译英';
  if(t==='cloze') return '句子 · 中译英';
  if(t==='ipa') return '单词 · 音标拼写';
  return '单词 · 中译英';
}
function typeGroup(t){
  return (t==='word-zh'||t==='word-en'||t==='word-ipa'||t==='spell'||t==='recall'||t==='ipa') ? 'word' : 'sentence';
}
function findWordData(word){
  const k = key(word);
  for(let i=DB.batches.length-1;i>=0;i--){
    const b = DB.batches[i];
    if(!b || !Array.isArray(b.words)) continue;
    const w = b.words.find(x=> key(x.word)===k);
    if(w) return w;
  }
  return null;
}
function clozeSentence(c){
  const info = findWordData(c.word);
  if(!info || !Array.isArray(info.sentences)) return null;
  const target = String(c.word||'').toLowerCase();
  if(!target) return null;
  const isLetter = ch => ch >= 'a' && ch <= 'z';
  for(let si=0; si<info.sentences.length; si++){
    const s = info.sentences[si];
    if(!s || !s.en) continue;
    const en = String(s.en);
    const low = en.toLowerCase();
    let idx = low.indexOf(target);
    while(idx >= 0){
      const before = idx > 0 ? low.charAt(idx-1) : ' ';
      const after = low.charAt(idx + target.length);
      if(!isLetter(before) && !isLetter(after)){
        return { en: en.slice(0, idx) + '____' + en.slice(idx + target.length), zh: s.zh || '' };
      }
      idx = low.indexOf(target, idx+1);
    }
  }
  return null;
}
function buildRecallOptions(c){
  const right = String(c.meaning||'').trim();
  if(!right) return [];
  const pool = [];
  Object.values(DB.cards).forEach(x=>{
    const m = String(x.meaning||'').trim();
    if(m && m!==right && pool.indexOf(m)<0) pool.push(m);
  });
  if(pool.length < 3) return [];
  const picked = pool.sort(()=> Math.random()-0.5).slice(0,3);
  const opts = picked.concat([right]);
  return opts.sort(()=> Math.random()-0.5);
}
let __zhPool = null, __zhPoolLen = -1;
function zhSentencePool(){
  const total = Object.keys(DB.cards).length;
  if(__zhPool && __zhPoolLen === total) return __zhPool;
  const out = [];
  const seen = Object.create(null);
  for(let i=0;i<DB.batches.length;i++){
    const ws = (DB.batches[i] && DB.batches[i].words) || [];
    for(let j=0;j<ws.length;j++){
      const ss = (ws[j] && ws[j].sentences) || [];
      for(let m=0;m<ss.length;m++){
        const z = String((ss[m] && ss[m].zh) || '').trim();
        if(z.length >= 4 && !seen[z]){ seen[z] = 1; out.push(z); }
        if(out.length >= 600) break;
      }
    }
  }
  __zhPool = out; __zhPoolLen = total;
  return out;
}
function sentTranslateOptions(c){
  const info = findWordData(c.word);
  if(!info || !Array.isArray(info.sentences)) return null;
  let pick = null;
  for(let i=0;i<info.sentences.length;i++){
    const s = info.sentences[i];
    if(s && s.en && s.zh){ pick = s; break; }
  }
  if(!pick) return null;
  const right = String(pick.zh).trim();
  const pool = [];
  const all = zhSentencePool();
  for(let i=0;i<all.length;i++){ if(all[i] !== right) pool.push(all[i]); }
  if(pool.length < 3) return null;
  const picked = pool.slice().sort(()=> Math.random()-0.5).slice(0,3);
  const opts = picked.concat([right]).sort(()=> Math.random()-0.5);
  return { en: String(pick.en||''), zh: right, opts: opts };
}
function typeAvailable(t, c, info){
  if(t==='word-zh') return buildRecallOptions(c).length >= 4;
  if(t==='word-en') return !!String(c.word||'').trim() && !!String(c.meaning||'').trim();
  if(t==='word-ipa') return !!(info.ipa || c.ipa);
  if(t==='sent-en') return !!clozeSentence(c);
  if(t==='sent-zh') return !!sentTranslateOptions(c);
  return false;
}

function pickReviewType(c){
  const info = findWordData(c.word) || {};
  const mode = DB.settings.practiceMode || 'all';
  const primary = modeTypes(mode);
  const secondary = [];
  for(let i=0;i<ALL_TYPES.length;i++){ if(primary.indexOf(ALL_TYPES[i]) < 0) secondary.push(ALL_TYPES[i]); }
  const base = (c.reps||0) % primary.length;
  for(let k=0;k<primary.length;k++){
    const t = primary[(base + k) % primary.length];
    if(typeAvailable(t, c, info)) return t;
  }
  for(let k=0;k<secondary.length;k++){
    if(typeAvailable(secondary[k], c, info)) return secondary[k];
  }
  return 'word-en';
}
function showReviewQuestion(c){
  const t = pickReviewType(c);
  state.revType = t;
  const info = findWordData(c.word) || {};
  const ipa = esc(info.ipa || c.ipa || '');
  const head = '<p class="small muted" style="margin:0 0 6px">' + (state.reviewIdx+1) + ' / ' + state.reviewQueue.length + ' · ' + typeLabel(t) + '</p>';

  if(t==='word-zh'){

    openSheet(head +
      '<h3 style="margin-bottom:4px">' + esc(c.word) + sndBtn(c.word) + ' <span class="muted" style="font-weight:400;font-size:13px">' + ipa + '</span></h3>' +
      '<p class="small muted" style="margin-bottom:10px">这个词是什么意思？</p>' +
      opts.map(function(o){ return '<button class="btn block" style="margin-bottom:8px;text-align:left;justify-content:flex-start" data-act="revPick" data-v="' + esc(o) + '">' + esc(o) + '</button>'; }).join('')
    );

  if(t==='sent-zh'){

        so.opts.map(function(o){ return '<button class="btn block" style="margin-bottom:8px;text-align:left;justify-content:flex-start" data-act="revPickSent" data-v="' + esc(o) + '">' + esc(o) + '</button>'; }).join('')
      );
      return;
    }
  }

  let body = '';
  if(t==='word-en'){
    body = '<h3 style="margin-bottom:6px">' + esc(c.meaning) + '</h3><p class="small muted">写出英文单词</p>';
  }else if(t==='word-ipa'){
    body = '<h3 style="margin-bottom:6px">' + ipa + '</h3><p class="small muted">' + esc(info.pos||'') + '<br>看音标，写出英文单词</p>';
  }else if(t==='sent-en'){
    const cz = clozeSentence(c);
    if(cz){
      body = '<p class="small muted" style="margin:0 0 4px">把下面这句翻成英文，把空缺补上：</p>' +
        '<p style="font-size:16px;line-height:1.75;margin:0 0 8px">' + esc(cz.zh) + '</p>' +
        '<div style="font-size:15px;line-height:1.9;background:var(--soft);padding:10px 12px;border-radius:8px">' + esc(cz.en) + '</div>' +
        '<p class="small muted" style="margin-top:6px">空格里是本批词里的哪一个？</p>';
    }
  }
  if(!body){
    body = '<h3 style="margin-bottom:6px">' + esc(c.meaning) + '</h3><p class="small muted">写出英文单词</p>';
  }
  openSheet(head + body +
    '<input id="revInput" placeholder="输入英文单词" autocomplete="off" autocapitalize="off" spellcheck="false" style="margin:10px 0">' +
    '<div id="revHintBox" class="small" style="margin:-4px 0 10px;color:var(--accent);min-height:16px"></div>' +
    '<button class="btn primary block" data-act="revCheck">对答案</button>' +
    '<button class="btn block" data-act="revHint" style="margin-top:8px">💡 想不起来？给个提示</button>'
  );
  const inp = $('#revInput');
  if(inp){ inp.focus(); inp.onkeydown = function(e){ if(e.key==='Enter') doRevCheck(); }; }
}
function doRevCheck(){

function showReviewAnswer(c, ok){

    <div class="fb show ${ok?'ok':'no'}">${ok?'✓ 想起来了':'✗ 没想起来'}</div>

function gradeReview(g){
  const c = state.reviewQueue[state.reviewIdx];
  if(c){
    const k = key(c.word);
    if(c.__retry){
      logReview(c, g);
    }else{
      schedule(c, g);
      logReview(c, g);
      if(g < 2){
        if(!state.retried) state.retried = {};
        if(!state.retried[k]){
          state.retried[k] = true;
          state.reviewQueue.push(Object.assign({}, c, {__retry:true}));
        }
      }
    }
    save();
  }
  state.reviewIdx++;
  if(state.reviewIdx >= state.reviewQueue.length){ closeSheet(); render(); toast('本轮复习完成'); }

function exportAnki(){
  const b = curBatch();
  const list = b ? b.words : Object.values(DB.cards);
  if(!list.length){ toast('还没有词'); return; }
  const rows = [['正面','背面','例句']];
  list.forEach(w=>{
    const s = (w.sentences && w.sentences[0]) || {en:''};
    rows.push([
      w.meaning || '',
      (w.word+' '+(w.ipa||'')+' '+(w.meaning||'')+' '+(w.derivatives||'')).trim(),
      s.en || ''
    ]);
  });
  const tsv = rows.map(r=>r.map(x=>String(x).replace(/[\t\n\r]/g,' ')).join('\t')).join('\n');
  download('anki-'+todayStr()+'.txt', tsv, 'text/tab-separated-values;charset=utf-8');
  toast('已导出，Anki 导入时分隔符选 Tab');
}


/* ============ 数据页：概览 / 词库 / 曲线 ============ */
const libState = { tab:'overview', page:1, q:'', filter:'all', sort:'due' };
const LIB_PAGE = 50;

function daysBetween(a, b){
  const t1 = new Date(String(a)+'T00:00:00').getTime();
  const t2 = new Date(String(b)+'T00:00:00').getTime();
  if(isNaN(t1) || isNaN(t2)) return 0;
  return Math.round((t1-t2)/86400000);
}
function cardStatus(c){
  const l = c.lapses||0, st = c.step||0;
  if(l>=3) return {k:'weak', t:'易忘'};
  if((c.reps||0)===0) return {k:'new', t:'新词'};
  if(st>=5 && l<=1) return {k:'done', t:'已掌握'};
  if(st>=4) return {k:'solid', t:'巩固中'};
  return {k:'learning', t:'学习中'};
}
function dueText(c){
  const d = daysBetween(c.due || todayStr(), todayStr());
  if(d===0) return '今天复习';
  if(d>0) return '还有 '+d+' 天';
  return '已过期 '+(-d)+' 天';
}
function logReview(c, g){
  if(!Array.isArray(DB.reviewLog)) DB.reviewLog = [];
  DB.reviewLog.push({ d: todayStr(), k: key(c.word), g: g });
  const cut = addDays(-365);
  if(DB.reviewLog.length > 4000 || (DB.reviewLog[0] && DB.reviewLog[0].d < cut)){
    DB.reviewLog = DB.reviewLog.filter(x=> x.d >= cut).slice(-4000);
  }
}
function rebindActs(root){
  if(!root) return;
  root.querySelectorAll('[data-act]').forEach(el=>{ el.onclick = ()=>handleAct(el); });
}

function dataSegHTML(){
  const tabs = [['overview','概览'],['lib','词库'],['chart','曲线']];
  const bar = '<div class="seg">' + tabs.map(([k,t])=>
    `<button data-act="dataTab" data-tab="${k}" class="${libState.tab===k?'on':''}">${t}</button>`
  ).join('') + '</div>';
  if(libState.tab==='lib') return bar + libHTML();
  if(libState.tab==='chart') return bar + chartHTML();
  return bar + overviewHTML();
}

function overviewHTML(){
  const all = Object.values(DB.cards);
  const dueN = all.filter(c=> c.due && c.due<=todayStr()).length;
  const cnt = k => all.filter(c=> cardStatus(c).k===k).length;
  const weak = all.filter(c=> (c.lapses||0)>0).sort((a,b)=> b.lapses-a.lapses).slice(0,10);
  return `
  <div class="card">
    <div class="kv"><span>词库总量</span><b>${all.length} 词</b></div>
    <div class="kv"><span>待复习</span><b>${dueN} 词</b></div>
    <div class="kv"><span>已掌握</span><b>${cnt('done')} 词</b></div>
    <div class="kv"><span>今日新词</span><b>${todayNewCount()}${Number(DB.settings.newPerDay)>0?' / '+Number(DB.settings.newPerDay):'（不限）'}</b></div>
    <div class="kv"><span>本地占用</span><b style="color:${storageMB()>3.5?'var(--bad)':'inherit'}">${storageMB().toFixed(2)} MB / 约 5 MB</b></div>
    <div class="statrow">
      <span class="badge new">新词 ${cnt('new')}</span>
      <span class="badge learning">学习中 ${cnt('learning')}</span>
      <span class="badge solid">巩固中 ${cnt('solid')}</span>
      <span class="badge done">已掌握 ${cnt('done')}</span>
      <span class="badge weak">易忘 ${cnt('weak')}</span>
    </div>
  </div>
  ${weak.length ? `<div class="card"><h2>最容易忘的词</h2>
    ${weak.map(c=>`<div class="kv"><span>${esc(c.word)}</span><span class="small muted">忘 ${c.lapses} 次 · ${esc(c.meaning)}</span></div>`).join('')}
  </div>` : ''}`;
}

function libFiltered(){
  const raw = (libState.q||'').trim();
  const q = raw.toLowerCase();
  let list = Object.values(DB.cards).filter(c=>{
    if(q){
      const w = String(c.word||'').toLowerCase();
      const m = String(c.meaning||'');
      if(w.indexOf(q)<0 && m.indexOf(raw)<0) return false;
    }
    if(libState.filter==='all') return true;
    return cardStatus(c).k === libState.filter;
  });
  if(libState.sort==='lapse') list.sort((a,b)=> (b.lapses||0)-(a.lapses||0));
  else if(libState.sort==='word') list.sort((a,b)=> String(a.word).localeCompare(String(b.word)));
  else list.sort((a,b)=> String(a.due||'').localeCompare(String(b.due||'')) || String(a.word).localeCompare(String(b.word)));
  return list;
}
function libRowHTML(c){
  const st = cardStatus(c);
  return `<div class="librow" data-act="cardDetail" data-k="${esc(key(c.word))}">
    <div class="l1"><b>${esc(c.word)}</b>${c.pos?`<span class="pos">${esc(c.pos)}</span>`:''}</div>
    <div class="l2"><span class="mean">${esc(c.meaning||'—')}</span><span class="badge ${st.k}">${st.t}</span><span class="cnt">${dueText(c)}</span></div>
  </div>`;
}
function pagerHTML(pages){
  return `<button class="btn sm" data-act="libPage" data-p="${libState.page-1}"${libState.page<=1?' disabled':''}>上一页</button>
    <span class="small muted">第 ${libState.page} / ${pages} 页</span>
    <button class="btn sm" data-act="libPage" data-p="${libState.page+1}"${libState.page>=pages?' disabled':''}>下一页</button>`;
}
function emptyLibHTML(){
  return Object.keys(DB.cards).length ? '<div class="empty">没有符合条件的词</div>'
    : '<div class="empty">还没有词，去「新词」页生成第一批</div>';
}
function libHTML(){
  const list = libFiltered();
  const pages = Math.max(1, Math.ceil(list.length/LIB_PAGE));
  if(libState.page > pages) libState.page = pages;
  const slice = list.slice((libState.page-1)*LIB_PAGE, libState.page*LIB_PAGE);
  return `<div class="card">
    <input id="libQ" placeholder="搜索单词或释义…" value="${esc(libState.q)}">
    <div class="grid2" style="margin-top:8px">
      <select id="libFilter">
        <option value="all"${libState.filter==='all'?' selected':''}>全部状态</option>
        <option value="new"${libState.filter==='new'?' selected':''}>新词</option>
        <option value="learning"${libState.filter==='learning'?' selected':''}>学习中</option>
        <option value="solid"${libState.filter==='solid'?' selected':''}>巩固中</option>
        <option value="done"${libState.filter==='done'?' selected':''}>已掌握</option>
        <option value="weak"${libState.filter==='weak'?' selected':''}>易忘</option>
      </select>
      <select id="libSort">
        <option value="due"${libState.sort==='due'?' selected':''}>按下次复习</option>
        <option value="lapse"${libState.sort==='lapse'?' selected':''}>按遗忘次数</option>
        <option value="word"${libState.sort==='word'?' selected':''}>按字母</option>
      </select>
    </div>
    <p class="muted small" id="libCount" style="margin:8px 0 2px">共 ${list.length} 个词</p>
    <div id="libBox">${slice.length?slice.map(libRowHTML).join(''):emptyLibHTML()}</div>
    <div class="pager" id="libPager">${pages>1?pagerHTML(pages):''}</div>
  </div>`;
}
function refreshLib(){
  const box = $('#libBox'); if(!box) return;
  const list = libFiltered();
  const pages = Math.max(1, Math.ceil(list.length/LIB_PAGE));
  if(libState.page > pages) libState.page = pages;
  const slice = list.slice((libState.page-1)*LIB_PAGE, libState.page*LIB_PAGE);
  box.innerHTML = slice.length ? slice.map(libRowHTML).join('') : emptyLibHTML();
  const cnt = $('#libCount'); if(cnt) cnt.textContent = '共 '+list.length+' 个词';
  const pg = $('#libPager'); if(pg){ pg.innerHTML = pages>1?pagerHTML(pages):''; rebindActs(pg); }
  rebindActs(box);
}

  if(!c){ toast('这个词不在词库里'); return; }
  const st = cardStatus(c);
  const b = DB.batches.find(x=> x.id===c.batchId);
  openSheet(`
    <h2 style="margin:0 0 4px">${esc(c.word)}${sndBtn(c.word)}</h2>
    <p class="muted small" style="margin:0 0 10px">${esc(c.ipa||'')}</p>
    <div class="kv"><span>状态</span><span class="badge ${st.k}">${st.t}</span></div>
    <div class="kv"><span>释义</span><b style="text-align:right">${esc(c.meaning||'—')}</b></div>

function chartHTML(){
  return `
  <div class="card">
    <h2>未来 30 天复习量</h2>
    <div class="chartbox">${chartDue30()}</div>
    <p class="muted small" style="margin-top:6px">深色柱＝今天；已过期的词计入今天。</p>
  </div>
  <div class="card">
    <h2>记忆状态分布</h2>
    <div class="chartbox">${chartStatusBar()}</div>
  </div>
  <div class="card">
    <h2>最近 14 天复习量</h2>
    <div class="chartbox">${chartDaily()}</div>
  </div>`;
}
function chartDue30(){
  const t = todayStr();
  const buckets = [];
  for(let i=0;i<30;i++) buckets.push({ n:0 });
  Object.values(DB.cards).forEach(c=>{
    if(!c.due) return;
    let i = daysBetween(c.due, t);
    if(i < 0) i = 0;
    if(i < 30) buckets[i].n++;
  });
  const max = Math.max(1, ...buckets.map(b=>b.n));
  const W = 320, H = 120, pad = 16, plotH = H - pad - 12;
  const gap = (W - pad*2) / 30, bw = gap * 0.62;
  let bars = '';
  buckets.forEach((b,i)=>{
    if(!b.n) return;
    const h = Math.max(2, b.n/max*plotH);
    const x = pad + i*gap + (gap-bw)/2;
    const y = H - pad - h;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1" fill="${i===0?'#c2410c':'#a8a29e'}"/>`;
    if(i===0) bars += `<text x="${(x+bw/2).toFixed(1)}" y="${(y-3).toFixed(1)}" font-size="8.5" fill="#c2410c" text-anchor="middle">${b.n}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#e7e5e4"/>
    ${bars}
    <text x="${pad}" y="${H-3}" font-size="8.5" fill="#78716c">今天</text>
    <text x="${W-pad}" y="${H-3}" font-size="8.5" fill="#78716c" text-anchor="end">30天后</text>
    <text x="${W-pad}" y="11" font-size="8.5" fill="#78716c" text-anchor="end">峰值 ${max} 词/天</text>
  </svg>`;
}
function chartStatusBar(){
  const all = Object.values(DB.cards);
  if(!all.length) return '<div class="empty">还没有词</div>';
  const order = [['new','新词','#a8a29e'],['learning','学习中','#ea580c'],['solid','巩固中','#2563eb'],['done','已掌握','#15803d'],['weak','易忘','#b91c1c']];
  const counts = {}; order.forEach(o=>counts[o[0]]=0);
  all.forEach(c=>{ const k = cardStatus(c).k; counts[k] = (counts[k]||0)+1; });
  const total = all.length, W = 320, H = 24;
  let x = 0, rects = '';
  order.forEach(o=>{
    const w = counts[o[0]]/total*W;
    if(w>0) rects += `<rect x="${x.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="${H}" fill="${o[2]}"/>`;
    x += w;
  });
  const legend = order.map(o=>`<span class="lg"><i style="background:${o[2]}"></i>${o[1]} ${counts[o[0]]}</span>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:22px;display:block;border-radius:5px;overflow:hidden">${rects}</svg>
    <div class="legend">${legend}</div>`;
}
function chartDaily(){
  const log = Array.isArray(DB.reviewLog)?DB.reviewLog:[];
  if(!log.length) return '<div class="empty">从今天开始记录，明天这里会有数据</div>';
  const days = [];
  for(let i=13;i>=0;i--) days.push(addDays(-i));
  const map = {};
  log.forEach(x=>{ map[x.d] = (map[x.d]||0)+1; });
  const vals = days.map(d=> map[d]||0);
  const max = Math.max(1, ...vals);
  const W = 320, H = 110, pad = 14, plotH = H - pad - 12;
  const gap = (W - pad*2) / 14, bw = gap * 0.62;
  let bars = '';
  vals.forEach((v,i)=>{
    if(!v) return;
    const h = Math.max(2, v/max*plotH);
    const x = pad + i*gap + (gap-bw)/2;
    const y = H - pad - h;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1" fill="#c2410c" opacity="${0.45 + 0.55*i/13}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#e7e5e4"/>
    ${bars}
    <text x="${pad}" y="${H-3}" font-size="8.5" fill="#78716c">14天前</text>
    <text x="${W-pad}" y="${H-3}" font-size="8.5" fill="#78716c" text-anchor="end">今天</text>
    <text x="${W-pad}" y="11" font-size="8.5" fill="#78716c" text-anchor="end">峰值 ${max} 次/天</text>
  </svg>`;
}


/* ============ 生成预览 / 确认入库 ============ */
function viewPreview(){
  const p = state.preview;
  if(!p){
    return `<div class="card"><div class="empty">没有待确认的内容<br><button class="btn sm" data-act="go" data-v="new" style="margin-top:10px">去生成</button></div></div>`;
  }
  const n = p.sel.filter(Boolean).length;
  return `
  <div class="card">
    <h2>确认要导入的词（${n} / ${p.words.length}）</h2>
    <p class="small muted" style="margin:6px 0">勾掉不要的（识别错、太简单、已经会了的），再点最下面确认。</p>
    <div class="row" style="margin:8px 0 4px">
      <button class="btn sm" data-act="pvAll" data-v="1">全选</button>
      <button class="btn sm" data-act="pvAll" data-v="0">全不选</button>
    </div>
    ${p.words.map((w,i)=>`
      <label style="display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid var(--line)">
        <input type="checkbox" data-act="pvToggle" data-i="${i}" ${p.sel[i]?'checked':''} style="width:auto;margin:4px 0 0 0;flex:none">
        <span style="flex:1;min-width:0">
          <b>${esc(w.word)}</b>
          <span class="small muted">${esc(w.pos||'')} ${esc(w.ipa||'')}</span>
          <span class="small muted" style="display:block">${esc(w.meaning||'')}</span>
        </span>
      </label>`).join('')}
    <button class="btn primary block" data-act="pvConfirm" style="margin-top:14px" ${n?'':'disabled'}>确认导入 ${n} 个词</button>
    <button class="btn block" data-act="pvCancel" style="margin-top:8px">放弃这次生成</button>
  </div>
  <p class="muted small">${(p.article && p.article.text) ? '会同时保存文章与题目。' : '这一批没有文章和题目（生成时选了「只要词表」）。'}</p>`;
}
function confirmPreview(){
  const p = state.preview;
  if(!p) return;
  const picked = p.words.filter((w,i)=> p.sel[i]);
  if(!picked.length){ toast('一个词都没选，勾几个再确认'); return; }
  const batch = {
    id: 'b'+Date.now(),
    createdAt: todayStr(),
    goal: p.goal,
    words: picked,
    article: p.article || {title:'', genre:'', wordCount:0, text:'', translation:[]},
    quiz: p.quiz || []
  };
  DB.batches.push(batch);
  DB.activeBatchId = batch.id;
  batch.words.forEach(w=> upsertCard(w, batch.id));
  save();
  state.preview = null;
  pendingImage = null;
  state.quizAnswers = {}; state.quizResult = null;
  state.showTranslation = false; state.whichArticle = 'main';
  state.retried = {};
  state.view = 'read';
  render(); window.scrollTo(0,0);
  toast('已导入 '+batch.words.length+' 个词');
}

/* ============ 自测 ============ */
function selfTest(){
  const cases = [
    ['spell','adjust','adjust',true],
    ['spell','adjustment','adjust',false],
    ['spell','adust','adjust',true],
    ['spell','ADJUST','adjust',true],
    ['spell',' adjust ','adjust',true],
    ['spell','adjustt','adjust',true],
    ['spell','adj','adjust',false],
    ['spell','','adjust',false],
    ['fill','from scratch','from scratch',true],
    ['fill','scratch','from scratch',false],
    ['sense','①极其重要的','①极其重要的|②生气勃勃的',true],
    ['collocation','tune up','tune up|tune in',true],
    ['sense','极其重要的','①极其重要的',true],
    ['sense','极其重要','①极其重要的',true],
    ['fill','fromscratch','from scratch',true]
  ];
  var base = cases.map(function(c){
    var got = judgeAnswer(c[0], c[1], c[2]);
    return (got===c[3]?'PASS':'FAIL') + ' | ' + c[0] + ' | "' + c[1] + '" vs "' + c[2] + '" | got=' + got + ' expect=' + c[3];
  });
  var P = parseOptions('He _____ the plan. (A) abandoned (B) approached (C) benefited (D) campaigned');
  base.push((P.options.length===4 ? 'PASS' : 'FAIL') + ' | 选项解析 | 括号式 A-D 数量=' + P.options.length);
  base.push((P.stem.indexOf('(A)') < 0 && P.stem.indexOf('plan') > 0 ? 'PASS' : 'FAIL') + ' | 题干剥离 | ' + P.stem);
  var P2 = parseOptions('Fill the blank. A. abandoned B. approached C. benefited D. campaigned');
  base.push((P2.options.length===4 ? 'PASS' : 'FAIL') + ' | 选项解析 | 点号式 A-D 数量=' + P2.options.length);
  var P3 = parseOptions('用 accurate 的适当形式填空');
  base.push((P3.options.length===0 ? 'PASS' : 'FAIL') + ' | 选项解析 | 无选项题不误判');
  base.push((judgeChoice({answer:'abandoned'},{key:'A',text:'abandoned'}) ? 'PASS' : 'FAIL') + ' | 判分 | 选项文本命中');
  return base;
}
